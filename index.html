<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Teilbarkeitsregeln – Lernkarten</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg: #f5f7fb;
      --card-bg: #ffffff;
      --accent: #3857a6;
      --accent-soft: #e1e7ff;
      --text-main: #222831;
      --text-muted: #666f7a;
      --border-radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: var(--bg);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .app {
      max-width: 480px;
      width: 100%;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
      padding: 24px 20px 20px;
    }

    .header {
      margin-bottom: 16px;
      text-align: center;
    }

    .title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--accent);
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .flashcard {
      background: var(--accent-soft);
      border-radius: var(--border-radius);
      padding: 20px;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }

    .pill {
      position: absolute;
      top: 12px;
      right: 14px;
      font-size: 0.75rem;
      background: rgba(56, 87, 166, 0.08);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 999px;
    }

    .question {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .hint {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .answer {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px dashed rgba(56, 87, 166, 0.35);
      display: none;
    }

    .answer-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--accent);
    }

    .answer-text {
      font-size: 0.95rem;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 6px;
    }

    button {
      flex: 1;
      padding: 10px 12px;
      border-radius: 999px;
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.07s ease, box-shadow 0.07s ease,
        background 0.15s ease;
    }

    button:active {
      transform: translateY(1px);
      box-shadow: none;
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(56, 87, 166, 0.
